<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./filmfinder/imagens/filmfinder-logo-certa.png" type="image/png">
    <link rel="stylesheet" href="./filmfinder/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>.FilmFinder</title>
</head>
<body>
    <header class="header-top">
        <div class="filmfinder-img">
            <img class="image-filmfinder" src="./filmfinder/imagens/filmfinder-logo-certa.png" alt="Imagem logo FilmFinder">
        </div>
        <nav class="header-nav">
            <a href="./filmfinder/pages/filmes.html">Filmes</a>
            <a href="./filmfinder/pages/populares.html">Populares</a>
            <a href="./filmfinder/pages/sobre.html">Sobre</a>
        </nav>
    </header>

    <section class="cont-destaque">
        <div class="movie-card" data-movie-id="414906">
            <div class="titulo-destaque">
                <img src="./filmfinder/imagens/clapperboard.svg" alt="logo-destaque" class="logo-destaque-dia">
                <h2>Destaque do Dia</h2>
            </div>
            <img id="destaque-poster" class="poster-destaque" src="https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg" alt="Batman 2022">
            <h2 id="destaque-titulo" class="name-movie">Batman</h2>

            <div class="movie-info">
                <div class="movie-info2">
                    <p id="destaque-nota" class="nota-estrela">⭐ 7.8</p>
                    <p id="destaque-data" class="data-lan">📅 2022</p>
                    <p id="destaque-genero" class="genero">🎭 Ação / Crime</p>
                </div>
                <p id="destaque-descricao">Um vigilante investiga crimes sombrios enquanto Gotham mergulha no caos.</p>
                <a id="destaque-link" class="btn-detalhes" href="./filmfinder/pages/detalhes.html?id=414906">Ver detalhes</a>
            </div>
        </div>
    </section>

    <section class="cards-alta">
        <div class="top-cards">
            <img src="./filmfinder/imagens/FogoBrancoDoEmAlta.png" alt="Fogo do Em alta">
            <h2>Em alta</h2>
        </div>

        <div id="lista-em-alta" class="cards">
            <div class="movies-cards" data-movie-id="299534">
                <a class="poster-link" href="./filmfinder/pages/detalhes.html?id=299534">
                    <img class="movie-poster" src="https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg" alt="Poster do filme">
                </a>
                <h2 class="movie-title">Vingadores Endgame</h2>
            </div>

            <div class="movies-cards" data-movie-id="808">
                <a class="poster-link" href="./filmfinder/pages/detalhes.html?id=808">
                    <img class="movie-poster" src="https://image.tmdb.org/t/p/w500/iB64vpL3dIObOtMZgX3RqdVdQDc.jpg" alt="Poster do filme">
                </a>
                <h2 class="movie-title">Shrek</h2>
            </div>

            <div class="movies-cards" data-movie-id="693134">
                <a class="poster-link" href="./filmfinder/pages/detalhes.html?id=693134">
                    <img class="movie-poster" src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg" alt="Poster do filme">
                </a>
                <h2 class="movie-title">Duna Parte 2</h2>
            </div>

            <div class="movies-cards" data-movie-id="414906">
                <a class="poster-link" href="./filmfinder/pages/detalhes.html?id=414906">
                    <img class="movie-poster" src="https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg" alt="Poster do filme">
                </a>
                <h2 class="movie-title">Batman</h2>
            </div>
        </div>
    </section>

    <section class="cards-avaliados">
        <div class="title-avaliados">
            <img src="./filmfinder/imagens/star.svg" alt="Estrela do Top avaliados">
            <h2>Top avaliados</h2>
        </div>

        <div id="lista-top-avaliados" class="movies-avaliados">
            <div class="movie-avaliado-card" data-movie-id="157336">
                <a class="movie-avaliado" href="./filmfinder/pages/detalhes.html?id=157336">
                    <img class="movie-poster" src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" width="300" alt="Capa do Interestelar">
                </a>
                <div class="textos-avaliados">
                    <div class="linha-titulo-avaliado">
                        <img src="./filmfinder/imagens/icons8-medal-100.png" alt="Medalha de primeiro lugar">
                        <h2 class="movie-title">Interestelar</h2>
                    </div>
                    <p class="movie-rating">⭐ 9.0</p>
                </div>
            </div>

            <div class="movie-avaliado-card" data-movie-id="550">
                <a class="movie-avaliado" href="./filmfinder/pages/detalhes.html?id=550">
                    <img class="movie-poster" src="https://image.tmdb.org/t/p/w500/uDO8zWDhfWwoFdKS4fzkUJt0Rf0.jpg" width="300" alt="Capa do Clube da Luta">
                </a>
                <div class="textos-avaliados">
                    <div class="linha-titulo-avaliado">
                        <img src="./filmfinder/imagens/icons8-medalha-prata-100.png" alt="Medalha de segundo lugar">
                        <h2 class="movie-title">La La Land</h2>
                    </div>
                    <p class="movie-rating">⭐ 8.8</p>
                </div>
            </div>

            <div class="movie-avaliado-card" data-movie-id="597">
                <a class="movie-avaliado" href="./filmfinder/pages/detalhes.html?id=597">
                    <img class="movie-poster" src="https://image.tmdb.org/t/p/w500/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg" width="300" alt="Capa do Titanic">
                </a>
                <div class="textos-avaliados">
                    <div class="linha-titulo-avaliado">
                        <img src="./filmfinder/imagens/icons8-medalha-bronze-100.png" alt="Medalha de terceiro lugar">
                        <h2 class="movie-title">Titanic</h2>
                    </div>

                    <p class="movie-rating">⭐ 7.7</p>
                    
                </div>
            </div>
        </div>
    </section>

    <script src="./filmfinder/js/engine.js"></script>
</body>
</html>
