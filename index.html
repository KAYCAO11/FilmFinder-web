<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./filmfinder/imagens/filmfinder-logo-certa.png" type="image/png">
    <link rel="stylesheet" href="./filmfinder/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>.FilmFinder</title>
</head>
<body>
    <header class="header-top">
        <div class="filmfinder-img">
            <img class="image-filmfinder" src="./filmfinder/imagens/filmfinder-logo-certa.png" alt="Imagem logo FilmFinder">
        
        </div>
        <nav class="header-nav">
            <a href="./filmfinder/pages/filmes.html">Filmes</a>
            <a href="./filmfinder/pages/populares.html">Populares</a>
            <a href="./filmfinder/pages/sobre.html">Sobre</a>
        </nav>
    </header>

    <section class="cont-destaque">
        <div class="movie-card">
            <div class="titulo-destaque">
                <img src="./filmfinder/imagens/clapperboard.svg" alt="logo-destaque" class="logo-destaque-dia">
                <h2>Destaque do Dia</h2>
            </div>
            <img class="poster-destaque" src="https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg" alt="Batman 2022"> 
            <h2 class="name-movie">Batman</h2>

        <div class="movie-info"> 
            <div class="movie-info2">
                <p class="nota-estrela">⭐ 7.8</p>
                <p class="data-lan"> 📅 2022</p>
                <p class="genero"> 🎭 Ação / Crime</p>
            </div>
             <p>Um vigilante investiga crimes sombrios enquanto Gotham mergulha no caos.</p>
            <a class="btn-detalhes" href="./filmfinder/pages/detalhes.html">Ver detalhes</a>
        </div>   
        </div>
    </section>

    <section class="cards-alta">
        <div class="top-cards">
            <img src="./filmfinder/imagens/FogoBrancoDoEmAlta.png" alt="Fogo do Em alta">
            <h2>Em alta</h2>
        </div>

        <div class="cards">
            <div class="movies-cards">
                <a class="poster-link" href="./filmfinder/pages/detalhes.html">
                    <img src="https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg" alt="Poster do filme">
                </a>
                <h2>vingadores Endgame</h2>
            </div>
            
            <div class="movies-cards">
                <a class="poster-link" href="./filmfinder/pages/detalhes.html">
                    <img src="https://image.tmdb.org/t/p/w500/iB64vpL3dIObOtMZgX3RqdVdQDc.jpg" alt="Poster do filme">
                </a>
                <h2>Shrek</h2>
            </div>

            <div class="movies-cards">
                <a class="poster-link" href="./filmfinder/pages/detalhes.html">
                    <img src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg" alt="Poster do filme">
                </a>
               <h2> Duna Parte 2</h2>
            </div>

            <div class="movies-cards">
                <a class="poster-link" href="./filmfinder/pages/detalhes.html">
                    <img src="https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg" alt="Poster do filme">
                </a>
                <h2>Batman</h2>
            </div>    
        </div>

    </section>
    <script src="./filmfinder/js/engine.js"></script>
</body>
</html>
