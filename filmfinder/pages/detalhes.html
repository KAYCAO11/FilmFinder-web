<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../imagens/Logo-Pipoca-FilmFinder.svg" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>.FilmFinder | Detalhes</title>
</head>
<body>
    <main id="detalhes-filme" class="detalhes-filme">
        <section class="detalhes-card">
            <img id="detalhes-poster" class="detalhes-poster" src="../imagens/filmfinder-logo-certa.png" alt="Poster do filme">

            <div class="detalhes-info">
                <h1 id="detalhes-titulo" class="detalhes-titulo">Carregando filme...</h1>
                <p id="detalhes-nota" class="detalhes-nota"></p>
                <p id="detalhes-data" class="detalhes-data"></p>
                <p id="detalhes-generos" class="detalhes-generos"></p>
                <p id="detalhes-descricao" class="detalhes-descricao"></p>
            </div>
        </section>

        <section id="detalhes-trailer-section" class="detalhes-trailer-section">
            <h2>Trailer</h2>
            <div id="detalhes-trailer" class="detalhes-trailer"></div>
        </section>
    </main>
    
    <script src="../js/engine.js"></script>
</body>
</html>
