<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../imagens/filmfinder-logo-certa.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>.FilmFinder</title>
</head>
<body>
    <header class="header-filmes">
        <a href="/index.html">
            <img src="/filmfinder/imagens/filmfinder-logo-certa.png" alt="Logo do FilmFinder">
        </a>
    </header>

    <section class="top-section-form">
        <div class="form-class">
            <form class="search-bar">
                <button class="search-button" type="submit" aria-label="Buscar filme">
                    <img src="/filmfinder/imagens/icons-pesquisar-lupa.svg" alt="">
                </button>
                <input autocomplete="off" class="search-input" type="text" placeholder="Buscar filme..." name="search">
            </form>
        </div>
    </section>
    <script src="../js/engine.js"></script>
</body>
</html>
